name: questlog
description: "A new Flutter project."
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.4.9
  drift: 2.28.2
  sqlite3_flutter_libs: 0.5.15
  go_router: 12.1.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.9.3
  clock: 1.1.2
  uuid: ^4.6.0
  material_symbols_icons: ^4.2814.1
  share_plus: ^13.3.0
  file_picker: ^12.1.2
  path_provider: ^2.1.6
  path: ^1.9.0
  collection: ^1.19.0
  intl: ^0.20.3
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  drift_dev: 2.28.3
  build_runner: 2.15.1
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk[wght].ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf

dependency_overrides:
  path_provider_android: 2.2.17
  path_provider_foundation: 2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/questlog.png"

  # Optional: If you also made a single-color version for Android 13+
  monochrome_icon_path: "assets/icon/questlog.png"
